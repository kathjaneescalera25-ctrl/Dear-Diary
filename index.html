<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dear Diary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="home">
        <h1>Dear Diary ♡</h1>
        <p>Welcome to my little corner of memories.</p>
        <button onclick="openDiary()">Open My Diary</button>
        <button onclick="showEntries()">My Entries</button>
    </div>

    <div class="container" id="diary" style="display: none;">
        <h1>My Diary ♡</h1>
        <p>A little space for my thoughts and memories.</p>

        <label>Your Name</label>
        <input type="text" id="ownerName" placeholder="Enter your name...">

        <label>Date</label>
        <input type="date" id="entryDate">

        <label>Entry Title</label>
        <input type="text" id="entryTitle" placeholder="Give your story a title...">

        <label>Dear Diary,</label>
        <textarea id="diaryEntry" placeholder="Write your thoughts here..."></textarea>

        <label>How are you feeling today?</label>
<select id="entryMood">
    <option value="">Choose your mood...</option>
    <option value="😊 Happy">😊 Happy</option>
    <option value="🥰 Loved">🥰 Loved</option>
    <option value="😢 Sad">😢 Sad</option>
    <option value="😡 Angry">😡 Angry</option>
    <option value="😴 Tired">😴 Tired</option>
    <option value="😌 Peaceful">😌 Peaceful</option>
    <option value="🥺 Anxious">🥺 Anxious</option>
</select>

    <label>Add a Memory ♡</label>
    <input type="file" id="entryImage" accept="image/*">

    <label>
    <input type="checkbox" id="entryFavorite">
    Add to my Favorites ♡
</label>

        <button onclick="saveEntry()">Save My Entry ♡</button>
        <button onclick="goHome()">Back</button>

        <div id="entries"></div>
    </div>

<div class="container" id="savedEntriesPage" style="display: none;">
    <h1>My Entries ♡</h1>
    <p>All my little memories in one place.</p>

    <div id="savedEntriesList"></div>

    <h2>My Diary Calendar ♡</h2>
<input type="month" id="diaryCalendar">
<div id="calendarEntries"></div>

<h2>My Diary Statistics ♡</h2>

<div class="statistics">
    <p>Total Entries: <span id="totalEntries">0</span></p>
    <p>Total Words: <span id="totalWords">0</span></p>
</div>

    <button onclick="goHome()">Back to Home</button>
</div>

    <script src="script.js"></script>
</body>
</html>
